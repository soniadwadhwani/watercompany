<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - AquaFlow Water Company</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="/" class="logo"><i class="fas fa-water"></i> AquaFlow</a>
      <div class="nav-links" id="navLinks">
        <a href="/" class="nav-link">Home</a>
        <a href="/register.html" class="nav-link" id="navRegister">Register</a>
        <a href="/login.html" class="nav-link active" id="navLogin">Login</a>
        <a href="/dashboard.html" class="nav-link hidden" id="navDashboard">Dashboard</a>
        <a href="/admin.html" class="nav-link hidden" id="navAdmin">Admin Panel</a>
        <button class="btn btn-outline btn-sm hidden" id="navLogout">Logout</button>
      </div>
      <button class="hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
    </div>
  </nav>

  <section class="auth-section">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon"><i class="fas fa-sign-in-alt"></i></div>
        <h2>Welcome Back</h2>
        <p>Login to manage your water connections</p>
      </div>
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required />
        </div>
        <div class="form-group">
          <label for="password"><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required />
        </div>
        <div id="loginError" class="form-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-block">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
      </form>
      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Register here</a>
      </div>
    </div>
  </section>

  <script src="/js/app.js"></script>
</body>
</html>
